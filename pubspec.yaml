name: robot_control_app
description: Production-ready Flutter client foundation for Robot Control API.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^3.4.2
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  json_annotation: ^4.12.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/ai_workspace_orb.png
    - assets/images/intelligence_orb.png
    - assets/images/motion_gesture_robots.png
    - assets/images/product_logo.png
    - assets/images/robot_core.png
    - assets/images/robot_sidebar_bust.png
